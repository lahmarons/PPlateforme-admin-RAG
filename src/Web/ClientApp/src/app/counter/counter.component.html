<div class="grid grid-cols-12 gap-6">
  <div class="col-span-12 lg:col-span-7 xl:col-span-5">
    <div class="card">
      <div class="flex flex-column gap-1 mb-4">
        <h5 class="m-0">Counter</h5>
        <p class="m-0 text-color-secondary">PrimeNG themed component example</p>
      </div>

      <div class="flex align-items-center justify-content-between mb-4">
        <span class="text-color-secondary">Current count</span>
        <p-tag [value]="currentCount.toString()" severity="info"></p-tag>
      </div>

      <button pButton type="button" icon="pi pi-plus" label="Increment" (click)="incrementCounter()"></button>
    </div>
  </div>
</div>
