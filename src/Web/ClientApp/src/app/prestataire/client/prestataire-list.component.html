<div class="grid grid-cols-12 gap-6">
  <div class="col-span-12">
    <div class="card">
      <div class="flex flex-column gap-1 mb-4">
        <h5 class="m-0">Prestataires</h5>
        <p class="m-0 text-color-secondary">Filtrer par spécialité et localisation</p>
      </div>

      <div class="grid grid-cols-12 gap-3 mb-4">
        <div class="col-span-12 md:col-span-8">
          <input pInputText class="w-full" placeholder="Recherche" [(ngModel)]="recherche" />
        </div>
        <div class="col-span-12 md:col-span-4 flex gap-2">
          <button pButton type="button" label="Filtrer" icon="pi pi-filter" (click)="applyFilters()"></button>
          <button pButton type="button" label="Reset" icon="pi pi-refresh" severity="secondary" (click)="clearFilters()"></button>
        </div>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>

      <div class="grid grid-cols-12 gap-4">
        @for (prestataire of prestataires; track prestataire.id) {
        <div class="col-span-12 md:col-span-6 xl:col-span-4">
          <p-card styleClass="h-full flex flex-column overflow-hidden hover:shadow-lg transition-shadow duration-200">
            <ng-template pTemplate="header">
              <div class="h-36 bg-gray-100 flex align-items-center justify-content-center border-bottom border-surface-200 p-4 relative">
                <img *ngIf="prestataire.logo" [src]="'data:image/png;base64,' + prestataire.logo" class="max-h-28 max-w-full object-contain" alt="Logo" />
                <div *ngIf="!prestataire.logo" class="w-16 h-16 rounded-full bg-white flex align-items-center justify-content-center border border-surface-200">
                  <i class="pi pi-building text-gray-400 text-3xl"></i>
                </div>
              </div>
            </ng-template>
            <ng-template pTemplate="title">
              <div class="font-bold text-xl">{{ prestataire.nom }}</div>
            </ng-template>
            <ng-template pTemplate="subtitle">
              <span class="text-sm text-color-secondary">Prestataire de service</span>
            </ng-template>
            <div class="flex flex-column gap-2 mt-2">
              <span class="text-color-secondary leading-relaxed">{{ prestataire.description || 'Description non disponible.' }}</span>
            </div>
          </p-card>
        </div>
        }
      </div>
    </div>
  </div>
</div>
