<div class="grid grid-cols-12 gap-6">
  <div class="col-span-12">
    <div class="card">
      <div class="flex flex-column gap-1 mb-4">
        <h5 class="m-0">Prestataires</h5>
        <p class="m-0 text-color-secondary">Filtrer par spécialité et localisation</p>
      </div>

      <div class="grid grid-cols-12 gap-3 mb-4">
        <div class="col-span-12 md:col-span-8">
          <input pInputText class="w-full" placeholder="Recherche" [(ngModel)]="recherche" />
        </div>
        <div class="col-span-12 md:col-span-4 flex gap-2">
          <button pButton type="button" label="Filtrer" icon="pi pi-filter" (click)="applyFilters()"></button>
          <button pButton type="button" label="Reset" icon="pi pi-refresh" severity="secondary" (click)="clearFilters()"></button>
        </div>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>

      <div class="grid grid-cols-12 gap-4">
        @for (prestataire of prestataires; track prestataire.id) {
        <div class="col-span-12 md:col-span-6 xl:col-span-4">
          <p-card>
            <ng-template pTemplate="title">{{ prestataire.nom }}</ng-template>
            <ng-template pTemplate="subtitle">{{ prestataire.description || 'Prestataire' }}</ng-template>
            <div class="flex flex-column gap-2">
              <span>{{ prestataire.description || 'Description non disponible.' }}</span>
            </div>
          </p-card>
        </div>
        }
      </div>
    </div>
  </div>
</div>
