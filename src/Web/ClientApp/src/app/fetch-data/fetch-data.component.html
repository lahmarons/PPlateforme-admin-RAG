<div class="grid">
  <div class="col-12">
    <p-card>
      <ng-template pTemplate="title">Weather Forecast</ng-template>
      <ng-template pTemplate="subtitle">Data loaded from the backend API</ng-template>

      @if (!forecasts?.length) {
      <div class="flex align-items-center gap-3 py-4">
        <p-progressSpinner strokeWidth="4" styleClass="w-2rem h-2rem"></p-progressSpinner>
        <span class="text-color-secondary">Loading forecasts...</span>
      </div>
      }
      @else {
      <p-table [value]="forecasts" [tableStyle]="{ 'min-width': '50rem' }" [stripedRows]="true" [paginator]="true" [rows]="10" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th>Date</th>
            <th>Temp. (C)</th>
            <th>Temp. (F)</th>
            <th>Summary</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-forecast>
          <tr>
            <td>{{ forecast.date | date: 'mediumDate' }}</td>
            <td>{{ forecast.temperatureC }}</td>
            <td>{{ forecast.temperatureF }}</td>
            <td>
              <p-tag [value]="forecast.summary || 'N/A'" severity="secondary"></p-tag>
            </td>
          </tr>
        </ng-template>
      </p-table>
      }
    </p-card>
  </div>
</div>
