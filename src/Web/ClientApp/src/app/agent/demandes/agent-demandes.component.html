<div class="grid grid-cols-12 gap-6">
  <div class="col-span-12">
    <div class="card">
      <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center gap-3 mb-4">
        <div>
          <h5 class="m-0">Consulter les demandes</h5>
          <p class="m-0 text-color-secondary">Décision sur la demande: valider ou refuser</p>
        </div>
        <p-select [options]="statusOptions" optionLabel="label" optionValue="value" [(ngModel)]="selectedStatus" (ngModelChange)="applyFilter()" placeholder="Filtrer par statut"></p-select>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>
      <p-message *ngIf="infoMessage" severity="info" [text]="infoMessage"></p-message>

      <p-table [value]="filteredDemandes" [paginator]="true" [rows]="10" [stripedRows]="true" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Citoyen</th>
            <th>Service</th>
            <th>Description</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-demande>
          <tr>
            <td>#{{ demande.id }}</td>
            <td>{{ demande.citoyenNom || '-' }}</td>
            <td>{{ demande.serviceNom || '-' }}</td>
            <td>{{ demande.description }}</td>
            <td><p-tag [value]="demande.statutName || 'Inconnu'" severity="secondary"></p-tag></td>
            <td>
              <div class="flex flex-wrap gap-2">
                <button pButton type="button" size="small" icon="pi pi-check" label="Valider" (click)="changeStatus(demande, 2)" severity="success"></button>
                <button pButton type="button" size="small" icon="pi pi-times" label="Refuser" (click)="changeStatus(demande, 3)" severity="danger"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
