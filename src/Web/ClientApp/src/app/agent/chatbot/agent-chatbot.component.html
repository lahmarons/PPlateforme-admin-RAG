<div class="chatbot-page">
  <div class="chatbot-card-shell">
    <div class="card chatbot-card">
      <div class="flex flex-column gap-1 mb-4 text-center">
        <h5 class="m-0">Interagir avec le chatbot</h5>
        <p class="m-0 text-color-secondary">Réponse automatique / aide agent</p>
      </div>

      <div class="flex flex-column gap-2 mb-3 p-3 border border-surface rounded-border surface-ground chatbot-messages" style="max-height: 24rem; overflow: auto;">
        @for (message of messages; track $index) {
        <div class="flex" [ngClass]="{ 'justify-content-end': message.from === 'agent' }">
          <p-tag [value]="message.text" [severity]="message.from === 'agent' ? 'info' : 'secondary'"></p-tag>
        </div>
        }
      </div>

      <div class="flex flex-column gap-2">
        <textarea pInputTextarea rows="3" [(ngModel)]="question" placeholder="Demandez une aide sur le traitement..."></textarea>
        <div class="flex justify-content-end">
          <button pButton type="button" icon="pi pi-send" label="Envoyer" (click)="send()"></button>
        </div>
      </div>
    </div>
  </div>
</div>
