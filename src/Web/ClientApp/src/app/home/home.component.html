<div class="grid">
  <div class="col-12">
    <p-card>
      <ng-template pTemplate="title">IdaraTech Dashboard</ng-template>
      <ng-template pTemplate="subtitle">Sakai-themed frontend integrated with your .NET backend</ng-template>

      <p class="m-0 text-color-secondary">
        Use quick actions below to navigate the key pages and verify theme changes (primary color, surface and dark mode).
      </p>

      <p-divider></p-divider>

      <div class="flex flex-wrap gap-2">
        <a pButton routerLink="/counter" icon="pi pi-calculator" label="Counter"></a>
        <a pButton routerLink="/fetch-data" icon="pi pi-cloud" label="Weather" severity="secondary"></a>
        <a pButton href="/api" target="_blank" rel="noopener noreferrer" icon="pi pi-link" label="API" severity="contrast"></a>
        <a pButton href="/Identity/Account/Manage" icon="pi pi-user" label="Account" severity="help"></a>
      </div>
    </p-card>
  </div>
</div>
