<div class="grid grid-cols-12 gap-6">
  <div class="col-span-12">
    <div class="card">
      <div class="flex flex-column gap-1 mb-4">
        <h5 class="m-0">Dashboard administrateur</h5>
        <p class="m-0 text-color-secondary">Analyses et accès rapides</p>
      </div>

      <p-message *ngIf="!session.isConnected()" severity="warn" text="Administrateur non connecté."></p-message>
      <p-message *ngIf="infoMessage" severity="info" [text]="infoMessage"></p-message>
      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>

      @if (!loading) {
      <div class="grid grid-cols-12 gap-4 mt-2">
        <div class="col-span-12 md:col-span-6 xl:col-span-3">
          <div class="surface-card border border-surface rounded-border p-4 flex justify-content-between align-items-center">
            <span class="text-color-secondary">Admins</span>
            <p-tag [value]="totalAdmins.toString()" severity="info"></p-tag>
          </div>
        </div>
        <div class="col-span-12 md:col-span-6 xl:col-span-3">
          <div class="surface-card border border-surface rounded-border p-4 flex justify-content-between align-items-center">
            <span class="text-color-secondary">Agents actifs</span>
            <p-tag [value]="activeAgents.toString()" severity="success"></p-tag>
          </div>
        </div>
        <div class="col-span-12 md:col-span-6 xl:col-span-3">
          <div class="surface-card border border-surface rounded-border p-4 flex justify-content-between align-items-center">
            <span class="text-color-secondary">Services actifs</span>
            <p-tag [value]="activeServices.toString()" severity="success"></p-tag>
          </div>
        </div>
        <div class="col-span-12 md:col-span-6 xl:col-span-3">
          <div class="surface-card border border-surface rounded-border p-4 flex justify-content-between align-items-center">
            <span class="text-color-secondary">Demandes</span>
            <p-tag [value]="totalDemandes.toString()" severity="warn"></p-tag>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-12 gap-4 mt-4">
        <div class="col-span-12 md:col-span-6">
          <div class="surface-card border border-surface rounded-border p-4 flex justify-content-between align-items-center">
            <span class="text-color-secondary">Demandes en attente</span>
            <p-tag [value]="demandesEnAttente.toString()" severity="warn"></p-tag>
          </div>
        </div>
        <div class="col-span-12 md:col-span-6">
          <div class="surface-card border border-surface rounded-border p-4 flex justify-content-between align-items-center">
            <span class="text-color-secondary">Demandes traitées</span>
            <p-tag [value]="demandesTraitees.toString()" severity="success"></p-tag>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 mt-4">
        <a pButton routerLink="/admin/services" icon="pi pi-briefcase" label="Gérer les services"></a>
        <a pButton routerLink="/admin/agents" icon="pi pi-users" label="Gérer les agents" severity="secondary"></a>
      </div>
      }
    </div>
  </div>
</div>
