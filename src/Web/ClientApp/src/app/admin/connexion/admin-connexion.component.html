<div class="grid grid-cols-12 gap-6">
  <div class="col-span-12 lg:col-span-7 xl:col-span-5">
    <div class="card">
      <div class="flex flex-column gap-1 mb-4">
        <h5 class="m-0">Connexion administrateur</h5>
        <p class="m-0 text-color-secondary">Accéder au dashboard admin</p>
      </div>

      <form class="flex flex-column gap-3" [formGroup]="form" (ngSubmit)="submit()">
        <div class="flex flex-column gap-1">
          <label for="email">Email</label>
          <input id="email" pInputText formControlName="email" />
        </div>

        <div class="flex flex-column gap-1">
          <label for="motDePasse">Mot de passe</label>
          <p-password id="motDePasse" formControlName="motDePasse" [feedback]="false" [toggleMask]="true"></p-password>
        </div>

        <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>

        <div class="flex gap-2">
          <button pButton type="submit" icon="pi pi-sign-in" label="Se connecter" [loading]="submitting"></button>
        </div>
      </form>
    </div>
  </div>
</div>
