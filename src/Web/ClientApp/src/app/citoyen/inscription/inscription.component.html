<app-floating-configurator />

<div class="auth-page">
  <div class="auth-card-shell auth-card-shell-wide">
    <div class="auth-card-accent"></div>
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <i class="pi pi-user-plus"></i>
        </div>
        <h1>Bienvenue</h1>
        <p>Créer un compte citoyen</p>
      </div>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit($event)" novalidate>
        <div class="grid grid-cols-12 gap-4">
          <div class="col-span-12 md:col-span-6 field">
            <label for="nom">Nom</label>
            <input id="nom" pInputText formControlName="nom" placeholder="Nom" />
          </div>

          <div class="col-span-12 md:col-span-6 field">
            <label for="telephone">Téléphone</label>
            <input id="telephone" pInputText formControlName="telephone" placeholder="Téléphone" />
          </div>

          <div class="col-span-12 field">
            <label for="email">Email</label>
            <input id="email" pInputText formControlName="email" placeholder="Email address" />
          </div>

          <div class="col-span-12 field">
            <label for="motDePasse">Mot de passe</label>
            <p-password id="motDePasse" formControlName="motDePasse" [feedback]="false" [toggleMask]="true" placeholder="Password"></p-password>
          </div>

          <div class="col-span-12 field">
            <label for="adresse">Adresse</label>
            <input id="adresse" pInputText formControlName="adresse" placeholder="Adresse" />
          </div>
        </div>

        <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>
        <p-message *ngIf="successMessage" severity="success" [text]="successMessage"></p-message>

        <button pButton type="submit" label="S'inscrire" icon="pi pi-user-plus" class="auth-submit" [loading]="submitting"></button>

        <a class="auth-link" routerLink="/citoyen/connexion">Se connecter</a>
      </form>
    </div>
  </div>
</div>
