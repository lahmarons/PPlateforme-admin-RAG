<div class="chat-container">
  <!-- ══ BADGE FAB (fermé) ══════════════════════════════ -->
  <div *ngIf="!isOpen" class="chat-badge" (click)="toggleChat()">
    <img src="assets/assitant.png" alt="IDARATECH" class="badge-avatar" />
    <span class="badge-pulse"></span>
    <span class="badge-notif">1</span>
  </div>

  <!-- ══ WIDGET (ouvert) ═══════════════════════════════ -->
  <div *ngIf="isOpen" class="chat-widget" [class.rtl]="isRTL()">
    <app-chat-header (onClearChat)="onClearChat()" (onCloseChat)="toggleChat()">
    </app-chat-header>

    <app-chat-messages
      [messages]="messages$ | async"
      [isLoading]="isLoading$ | async"
    >
    </app-chat-messages>

    <app-quick-replies
      (onQuickReplyClick)="onQuickReplyClick($event)"
    ></app-quick-replies>

    <app-chat-input (onSendMessage)="onSendMessage($event)"></app-chat-input>
  </div>
</div>
